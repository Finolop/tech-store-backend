services:
  postgres:
    image: postgres:16-alpine
    container_name: tech_store_pg
    restart: always
    environment:
      POSTGRES_USER: shop_admin
      POSTGRES_PASSWORD: shop_password
      POSTGRES_DB: shop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: